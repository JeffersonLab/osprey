  <title id="facility-map-title">The facility description: what a deployment knows about its machine, where each part comes from, and how the agent reaches it</title>
  <desc id="facility-map-desc">Left: a Matlab Middle Layer export, which osprey mml import files into data/mml/ beside the mapping.yaml that mml map --init writes and you complete; osprey mml emit reads data/mml/ and writes the marked files into data/, the virtual-accelerator files only from a 2.0 export. The data/ column holds the files a facility supplies; the facility identity rule sits at the profile root under rules/, not in data/. osprey knowledge build-ttl is a manual step from data/ to data/: it reads the hierarchical channel database, the in_context descriptions and the channel limits, types the result with the ontology passed as --ontology (default: the packaged demo table) and writes a TTL. osprey build copies data/ into build/, derives the teal parts and renders the agent's files. Facility knowledge: the channel namespace is the channel database in the file-backed modes, or the TTL corpus in graph mode, which is the preset default and stages no channel database. The TTL named by services.graphdb.ttl_path is indexed into a DuckDB graph index at build in graph mode, and seeded into Neo4j at the first deploy, into an empty store only; osprey knowledge seed-graph reseeds it. After build the ontology only feeds the agents' terminology tables. Knowledge pages are served by the facility-knowledge server. The identity rule is auto-loaded for the main agent; the data-visualizer subagent reaches it through the workspace facility_description tool. Operating bounds: channel limits feed the write checks described on the Safety Chain page, the virtual accelerator's drive clamp and its channel manifest. Simulation: the manifest is built from the channel tier files or the graph index, the machine seeds, machine_state_channels.json, the limits and the pyat-coupled part of the wiring; the wiring binds channels to lattice elements; the virtual accelerator runs the lattice when VA_LATTICE is set and serves CA and PVA. The lattice tools load whatever path the agent passes, and the pyat-specialist computes on the bundled demo ring. Device views: a pyAML configuration that references the lattice and that pyaml_measure loads in the python executor (pyAML branch only, dashed), and Bluesky devices derived at build from the channel roster unless bluesky_devices.yml overrides them. Right: the agent and the subagents each server answers.</desc>
