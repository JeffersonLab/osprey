  <title id="fmp-title">Proposed: one facility file, built from sources, every other file generated</title>
  <desc id="fmp-desc">On the left, the sources a facility keeps. Imported sources (a Middle Layer export with its mapping, a CSV channel list, a NARAD or TTL file, lattice decks) pass through input layers. Authored sources (a keyed fix file, the write limits, simulation scenarios, knowledge pages and the facility identity) are edited by hand; an input layer may seed the limits file once. osprey build combines them, applies the fixes and validates the result against the facility schema, which starts from the NARAD LinkML schema. The result is one generated facility file with places, devices, channels, models and limits, every record with a stable ID and provenance. Every other file is generated from it: channel-finder indexes, the knowledge graph in NARAD terms, the virtual accelerator inputs, a pyAML configuration per model, Bluesky devices, the limits table for the write checks and the facts in the agent prompts. Knowledge pages are copied and linked to device IDs. Each generated file has one reader, and the agent reaches them through its servers.</desc>
